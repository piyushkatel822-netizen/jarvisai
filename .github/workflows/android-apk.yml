name: Build JARVIS Android App

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "android-app/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build APK and AAB
        working-directory: android-app
        run: gradle --no-daemon :app:assembleDebug :app:bundleRelease

      - name: Upload Android builds
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Android-Builds
          path: |
            android-app/app/build/outputs/apk/debug/app-debug.apk
            android-app/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
