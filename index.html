<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PB AI — JARVIS</title>
<style>
body{font-family:Arial,sans-serif;background:#10131a;color:white;margin:0}
.container{max-width:700px;margin:auto;padding:20px}
h1{text-align:center}
#chat{height:60vh;overflow-y:auto;background:#181c25;border-radius:15px;padding:15px}
.msg{padding:10px;margin:8px 0;border-radius:10px}
.user{background:#26364d}
.jarvis{background:#202a22}
.row{display:flex;gap:8px;margin-top:12px}
input{flex:1;padding:14px;border:0;border-radius:10px;font-size:16px}
button{padding:14px 18px;border:0;border-radius:10px;font-weight:bold}
#send{background:#35c759;color:white}
</style>
</head>
<body>

<div class="container">
<h1>🤖 PB AI — JARVIS</h1>
<p style="text-align:center">Your Personal AI Assistant</p>

<div id="chat">
<div class="msg jarvis"><b>🤖 Jarvis:</b> Hello! Main Jarvis hoon. Aap kya poochna chahte hain?</div>
</div>

<div class="row">
<input id="command" placeholder="Type your command..." autocomplete="off">
<button id="send">Send</button>
</div>
</div>

<script>
const BACKEND="https://jarvisai-449c.onrender.com";
const input=document.getElementById("command");
const send=document.getElementById("send");
const chat=document.getElementById("chat");

function addMessage(name,text,type){
    const div=document.createElement("div");
    div.className="msg "+type;
    div.textContent=name+": "+text;
    chat.appendChild(div);
    chat.scrollTop=chat.scrollHeight;
}

async function askJarvis(){
    const command=input.value.trim();
    if(!command)return;

    addMessage("👤 You",command,"user");
    input.value="";
    send.disabled=true;
    send.textContent="Thinking...";

    try{
        const response=await fetch(BACKEND+"/ask",{
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({command:command})
        });

        const data=await response.json();

        if(data.reply){
            addMessage("🤖 Jarvis",data.reply,"jarvis");
        }else{
            addMessage("🤖 Jarvis","No response received.","jarvis");
        }
    }catch(error){
        addMessage("🤖 Jarvis","Backend connection failed.","jarvis");
    }

    send.disabled=false;
    send.textContent="Send";
}

send.addEventListener("click",askJarvis);

input.addEventListener("keydown",e=>{
    if(e.key==="Enter") askJarvis();
});
</script>

</body>
</html>
