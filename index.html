<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PB AI — JARVIS</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#0b0b0f;
    color:white;
    font-family:Arial,sans-serif;
    height:100vh;
    display:flex;
    flex-direction:column;
}

header{
    padding:15px;
    text-align:center;
    border-bottom:1px solid #292932;
    background:#111116;
}

header h2{
    margin:0;
}

#chat{
    flex:1;
    overflow-y:auto;
    padding:20px;
    max-width:900px;
    width:100%;
    margin:auto;
}

.message{
    display:flex;
    margin:12px 0;
}

.user{
    justify-content:flex-end;
}

.bot{
    justify-content:flex-start;
}

.bubble{
    max-width:80%;
    padding:12px 15px;
    border-radius:18px;
    line-height:1.45;
    white-space:pre-wrap;
}

.user .bubble{
    background:#2563eb;
}

.bot .bubble{
    background:#202027;
}

.chat-image{
    display:block;
    max-width:320px;
    width:100%;
    border-radius:15px;
    margin-top:8px;
}

.download{
    display:inline-block;
    margin-top:8px;
    padding:8px 12px;
    border-radius:10px;
    background:#33333d;
    color:white;
    text-decoration:none;
}

#composer{
    width:100%;
    max-width:900px;
    margin:auto;
    padding:12px;
    display:flex;
    gap:8px;
    align-items:center;
}

#input{
    flex:1;
    background:#18181f;
    color:white;
    border:1px solid #33333d;
    border-radius:25px;
    padding:13px 16px;
    outline:none;
}

button{
    border:0;
    cursor:pointer;
    color:white;
}

#plus{
    width:46px;
    height:46px;
    border-radius:50%;
    background:#30303a;
    font-size:25px;
}

#send{
    height:46px;
    padding:0 18px;
    border-radius:23px;
    background:#2563eb;
}

#voice{
    width:46px;
    height:46px;
    border-radius:50%;
    background:#30303a;
    font-size:20px;
}

#plusMenu{
    display:none;
    position:fixed;
    bottom:75px;
    left:15px;
    background:#202027;
    border:1px solid #383842;
    border-radius:15px;
    padding:8px;
    z-index:10;
}

.menuButton{
    display:block;
    width:170px;
    text-align:left;
    padding:12px;
    background:transparent;
    border-radius:10px;
    font-size:15px;
}

.menuButton:hover{
    background:#30303a;
}

#imageInput{
    display:none;
}

#imagePreview{
    display:none;
    max-width:900px;
    margin:auto;
    padding:5px 15px;
}

#imagePreview img{
    max-width:180px;
    max-height:180px;
    border-radius:14px;
}

.typing{
    opacity:.6;
}
</style>
</head>

<body>

<header>
    <h2>🤖 PB AI — JARVIS</h2>
</header>

<div id="chat">

    <div class="message bot">
        <div class="bubble">
            🤖 Jarvis: Hello! Main Jarvis hoon. Aap kya poochna chahte hain?
        </div>
    </div>

</div>

<div id="imagePreview">
    <img id="previewImg">
</div>

<div id="plusMenu">
    <button class="menuButton" onclick="choosePhoto()">📷 Photo</button>
    <button class="menuButton" onclick="chooseCamera()">📸 Camera</button>
</div>

<input
    id="imageInput"
    type="file"
    accept="image/*"
>

<div id="composer">

    <button id="plus" onclick="toggleMenu()">+</button>

    <input
        id="input"
        placeholder="Message JARVIS..."
        autocomplete="off"
    >

    <button id="voice" onclick="startVoice()">🎤</button>

    <button id="send" onclick="sendMessage()">Send</button>

</div>

<script>

const BACKEND = "https://jarvisai-449c.onrender.com";

let selectedImage = null;

const chat = document.getElementById("chat");
const input = document.getElementById("input");
const imageInput = document.getElementById("imageInput");
const previewBox = document.getElementById("imagePreview");
const previewImg = document.getElementById("previewImg");

function toggleMenu(){

    const menu = document.getElementById("plusMenu");

    if(menu.style.display === "block"){
        menu.style.display = "none";
    }else{
        menu.style.display = "block";
    }
}

function choosePhoto(){

    document.getElementById("plusMenu").style.display = "none";

    imageInput.removeAttribute("capture");
    imageInput.click();
}

function chooseCamera(){

    document.getElementById("plusMenu").style.display = "none";

    imageInput.setAttribute("capture","environment");
    imageInput.click();
}

imageInput.addEventListener("change",function(){

    const file = this.files[0];

    if(!file) return;

    selectedImage = file;

    const reader = new FileReader();

    reader.onload = function(e){

        previewImg.src = e.target.result;
        previewBox.style.display = "block";

        addImageMessage(
            "user",
            e.target.result,
            "📷 Photo uploaded"
        );
    };

    reader.readAsDataURL(file);
});

function addTextMessage(type,text){

    const message = document.createElement("div");

    message.className = "message " + type;

    const bubble = document.createElement("div");

    bubble.className = "bubble";

    bubble.textContent = text;

    message.appendChild(bubble);

    chat.appendChild(message);

    chat.scrollTop = chat.scrollHeight;

    return message;
}

function addImageMessage(type,src,text){

    const message = document.createElement("div");

    message.className = "message " + type;

    const bubble = document.createElement("div");

    bubble.className = "bubble";

    if(text){
        const caption = document.createElement("div");
        caption.textContent = text;
        bubble.appendChild(caption);
    }

    const img = document.createElement("img");

    img.src = src;
    img.className = "chat-image";

    bubble.appendChild(img);

    message.appendChild(bubble);

    chat.appendChild(message);

    chat.scrollTop = chat.scrollHeight;

    return message;
}

async function sendMessage(){

    const text = input.value.trim();

    if(!text && !selectedImage) return;

    if(text){
        addTextMessage("user",text);
    }

    input.value = "";

    const thinking = addTextMessage("bot","🤖 JARVIS is thinking...");

    try{

        if(selectedImage){

            const formData = new FormData();

            formData.append("image",selectedImage);
            formData.append("prompt",text || "Describe this image.");

            const response = await fetch(
                BACKEND + "/analyze-image",
                {
                    method:"POST",
                    body:formData
                }
            );

            const data = await response.json();

            thinking.remove();

            if(data.image_url){

                addGeneratedImage(
                    data.image_url,
                    data.message || "🖼️ JARVIS created the image."
                );

            }else{

                addTextMessage(
                    "bot",
                    data.message || "Image received successfully."
                );

                speak(data.message || "Image received successfully.");
            }

        }else{

            const response = await fetch(
                BACKEND + "/ask",
                {
                    method:"POST",
                    headers:{
                        "Content-Type":"application/json"
                    },
                    body:JSON.stringify({
                        command:text,
                        message:text
                    })
                }
            );

            const data = await response.json();

            thinking.remove();

            const answer =
                data.response ||
                data.answer ||
                data.message ||
                "Sorry, I could not understand that.";

            addTextMessage("bot",answer);

            speak(answer);
        }

    }catch(error){

        thinking.remove();

        addTextMessage(
            "bot",
            "❌ JARVIS server se connection nahi ho pa raha."
        );

        console.error(error);

    }

    selectedImage = null;
    imageInput.value = "";
    previewBox.style.display = "none";
    previewImg.src = "";
}

function addGeneratedImage(src,caption){

    const message = document.createElement("div");

    message.className = "message bot";

    const bubble = document.createElement("div");

    bubble.className = "bubble";

    const title = document.createElement("div");

    title.textContent = caption;

    bubble.appendChild(title);

    const img = document.createElement("img");

    img.src = src;
    img.className = "chat-image";

    bubble.appendChild(img);

    const download = document.createElement("a");

    download.href = src;
    download.download = "jarvis-generated-image.png";
    download.className = "download";
    download.textContent = "⬇️ Download";

    bubble.appendChild(download);

    message.appendChild(bubble);

    chat.appendChild(message);

    chat.scrollTop = chat.scrollHeight;

    speak(caption);
}

input.addEventListener("keydown",function(e){

    if(e.key === "Enter"){
        sendMessage();
    }

});

function startVoice(){

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

    if(!SpeechRecognition){

        addTextMessage(
            "bot",
            "🎤 Aapke browser mein voice input supported nahi hai."
        );

        return;
    }

    const recognition = new SpeechRecognition();

    recognition.lang = "en-IN";
    recognition.interimResults = false;

    recognition.start();

    recognition.onresult = function(event){

        const text =
            event.results[0][0].transcript;

        input.value = text;

        sendMessage();
    };

    recognition.onerror = function(){

        addTextMessage(
            "bot",
            "🎤 Voice input start nahi ho saka."
        );
    };
}

function speak(text){

    if(!("speechSynthesis" in window)) return;

    speechSynthesis.cancel();

    const utterance =
        new SpeechSynthesisUtterance(text);

    utterance.lang = "en-IN";
    utterance.rate = 1;

    speechSynthesis.speak(utterance);
}

</script>

</body>
</html>
