body {

        radial-gradient(ellipse at 50% -20%, #1a3155 0%, transparent 55%),

header {

    margin: 18px 0;

    from {

    }

        opacity: 1;
        transform: translateY(0);
    }
}

<body>

<header>
    <button id="sidebarToggle" onclick="toggleSidebar()">☰</button>
    <h2>🤖 PB AI — JARVIS</h2>
</header>

<div id="sidebarOverlay" onclick="closeSidebar()"></div>

<aside id="jarvisSidebar">
    <div id="sidebarTop">
        <strong>🤖 JARVIS Menu</strong>
        <button id="sidebarClose" onclick="closeSidebar()">×</button>
    </div>

    <button id="newChatButton" onclick="startNewChat()">
        ＋ New Chat
    </button>

    <div id="historyHeading">Recent Chats</div>
    <div id="historyList">
        <div id="historyEmpty">Your recent chats will appear here.</div>
    </div>
</aside>

<div id="chat">

    <div class="message bot">
        <div class="bubble">
            🤖 Jarvis: Hello! Main Jarvis hoon. Aap kya poochna chahte hain?
        </div>
    </div>

</div>

<div id="jarvisMusicPlayer" style="
display:none;
width:100%;
max-width:900px;
margin:12px auto;
padding:10px;
box-sizing:border-box;
">
    <div id="youtubePlayer" style="
        width:100%;
        aspect-ratio:16/9;
        background:#000;
        border-radius:14px;
        overflow:hidden;
    "></div>
</div>

<div id="imagePreview">
    <img id="previewImg">
</div>

<div id="plusMenu">
    <button class="menuButton" onclick="choosePhoto()">📷 Photo</button>
    <button class="menuButton" onclick="chooseCamera()">📸 Camera</button>
</div>

<input
    id="imageInput"
    type="file"
    accept="image/*"
>

<div id="composer">

    <button id="plus" onclick="toggleMenu()">+</button>

    <input
        id="input"
        placeholder="Message JARVIS..."
        autocomplete="off"
    >

    <button id="voice" onclick="startVoice()">🎤</button>

    <button id="send" onclick="sendMessage()">Send</button>

</div>

<script>

const BACKEND = "https://jarvisai-449c.onrender.com";

let selectedImage = null;

const chat = document.getElementById("chat");
const input = document.getElementById("input");
const imageInput = document.getElementById("imageInput");
const previewBox = document.getElementById("imagePreview");
const previewImg = document.getElementById("previewImg");

// JARVIS SIDEBAR AND SESSION HISTORY

const jarvisSessions = [];

function toggleSidebar() {
    document.getElementById("jarvisSidebar").classList.toggle("open");
    document.getElementById("sidebarOverlay").classList.toggle("open");
}

function closeSidebar() {
    document.getElementById("jarvisSidebar").classList.remove("open");
    document.getElementById("sidebarOverlay").classList.remove("open");
}

function getChatTitle() {
    const firstUser = chat.querySelector(".message.user .bubble");
    if (!firstUser) return "New Conversation";
    return firstUser.innerText.trim().slice(0, 32) || "New Conversation";
}

function renderHistory() {
    const list = document.getElementById("historyList");
    list.innerHTML = "";

    if (jarvisSessions.length === 0) {
        list.innerHTML = '<div id="historyEmpty">Your recent chats will appear here.</div>';
        return;
    }

    jarvisSessions.forEach((session, index) => {
        const button = document.createElement("button");
        button.className = "historyItem";
        button.textContent = "💬 " + session.title;
        button.onclick = () => openHistory(index);
        list.appendChild(button);
    });
}

function archiveCurrentChat() {
    if (!chat.querySelector(".message.user")) return;

    jarvisSessions.unshift({
        title: getChatTitle(),
        html: chat.innerHTML
    });

    if (jarvisSessions.length > 10) {
        jarvisSessions.pop();
    }

    renderHistory();
}

function startNewChat() {
    archiveCurrentChat();

    chat.innerHTML = `
        <div class="message bot">
            <div class="bubble">
                🤖 Jarvis: Hello! Main Jarvis hoon. Aap kya poochna chahte hain?
            </div>
        </div>
    `;

    selectedImage = null;
    previewImg.src = "";
    previewBox.style.display = "none";
    input.value = "";

    closeSidebar();
    input.focus();
}

function openHistory(index) {
    const selected = jarvisSessions[index];
    if (!selected) return;

    if (chat.querySelector(".message.user")) {
        jarvisSessions.unshift({
            title: getChatTitle(),
            html: chat.innerHTML
        });

        const selectedIndex = index + 1;
        jarvisSessions.splice(selectedIndex, 1);
    } else {
        jarvisSessions.splice(index, 1);
    }

    chat.innerHTML = selected.html;

    selectedImage = null;
    previewImg.src = "";
    previewBox.style.display = "none";
    input.value = "";

    renderHistory();
    closeSidebar();
    chat.scrollTop = chat.scrollHeight;
}


function toggleMenu(){

    const menu = document.getElementById("plusMenu");

    if(menu.style.display === "block"){
        menu.style.display = "none";
    }else{
        menu.style.display = "block";
    }
}

function choosePhoto(){

    document.getElementById("plusMenu").style.display = "none";

    imageInput.removeAttribute("capture");
    imageInput.click();
}

function chooseCamera(){

    document.getElementById("plusMenu").style.display = "none";

    imageInput.setAttribute("capture","environment");
    imageInput.click();
}

imageInput.addEventListener("change",function(){

    const file = this.files[0];

    if(!file) return;

    selectedImage = file;

    const reader = new FileReader();

    reader.onload = function(e){

        previewImg.src = e.target.result;
        previewBox.style.display = "block";

        addImageMessage(
            "user",
            e.target.result,
            "📷 Photo uploaded"
        );
    };

    reader.readAsDataURL(file);
});

function addTextMessage(type,text){

    const message = document.createElement("div");

    message.className = "message " + type;

    const bubble = document.createElement("div");

    bubble.className = "bubble";

    bubble.textContent = text;

    message.appendChild(bubble);

    chat.appendChild(message);

    chat.scrollTop = chat.scrollHeight;

    return message;
}

function addImageMessage(type,src,text){

    const message = document.createElement("div");

    message.className = "message " + type;

    const bubble = document.createElement("div");

    bubble.className = "bubble";

    if(text){
        const caption = document.createElement("div");
        caption.textContent = text;
        bubble.appendChild(caption);
    }

    const img = document.createElement("img");

    img.src = src;
    img.className = "chat-image";

    bubble.appendChild(img);

    message.appendChild(bubble);

    chat.appendChild(message);

    chat.scrollTop = chat.scrollHeight;

    return message;
}

function playYouTubeVideo(url){

    let videoId = "";

    try {
        const u = new URL(url);

        if(u.hostname.includes("youtu.be")){
            videoId = u.pathname.substring(1).split("/")[0];
        }else if(u.hostname.includes("youtube.com")){
            videoId = u.searchParams.get("v") || "";
        }

    } catch(e) {
        videoId = "";
    }

    if(!videoId){
        addTextMessage(
            "bot",
            "❌ JARVIS: Valid YouTube video link nahi mila."
        );
        return;
    }

    const player = document.getElementById("jarvisMusicPlayer");
    const iframe = document.getElementById("youtubePlayer");

    iframe.src =
        "https://www.youtube.com/embed/" +
        encodeURIComponent(videoId) +
        "?autoplay=1";

    player.style.display = "block";

    addTextMessage(
        "bot",
        "🎵 JARVIS Music Player mein song play ho raha hai."
    );
}

function showMusicPlayer(url){

    let videoId = "";

    try {
        const u = new URL(url);

        if(u.hostname.includes("youtu.be")){
            videoId = u.pathname.substring(1).split("/")[0];
        }

        if(u.hostname.includes("youtube.com")){
            videoId = u.searchParams.get("v") || "";
        }

    } catch(e) {}

    if(!videoId){
        addTextMessage(
            "bot",
            "❌ JARVIS ko YouTube video nahi mila."
        );
        return;
    }

    const player = document.getElementById("jarvisMusicPlayer");
    const iframe = document.getElementById("youtubePlayer");

    iframe.src =
        "https://www.youtube.com/embed/" +
        encodeURIComponent(videoId) +
        "?autoplay=1";

    player.style.display = "block";

    addTextMessage(
        "bot",
        "🎵 JARVIS Music Player mein song play ho raha hai."
    );
}



function stopJarvisMusic(){

    const player = document.getElementById("youtubePlayer");
    const box = document.getElementById("jarvisMusicPlayer");

    if(player){
        player.src = "about:blank";
    }

    if(box){
        box.style.display = "none";
    }

    addTextMessage("bot", "⏹️ Song stopped.");
}

function stopMusicWhenLeavingJarvis(){

    const player = document.getElementById("youtubePlayer");
    const box = document.getElementById("jarvisMusicPlayer");

    if(player){
        player.src = "about:blank";
    }

    if(box){
        box.style.display = "none";
    }
}

/* JARVIS se bahar jaate hi music stop */
document.addEventListener("visibilitychange", function(){

    if(document.hidden){
        stopMusicWhenLeavingJarvis();
    }

});

/* Page close/navigation par bhi music stop */
window.addEventListener("pagehide", function(){
    stopMusicWhenLeavingJarvis();
});



let jarvisMusicQueue = [];
let jarvisMusicIndex = 0;
let jarvisMusicStopped = false;
let jarvisYTPlayer = null;

function onYouTubeIframeAPIReady(){
    console.log("YouTube Player API ready");
}

function createJarvisPlayer(videoId){

    const box = document.getElementById("jarvisMusicPlayer");

    box.style.display = "block";

    if(jarvisYTPlayer){

        jarvisYTPlayer.loadVideoById(videoId);
        return;
    }

    jarvisYTPlayer = new YT.Player("youtubePlayer", {

        videoId: videoId,

        playerVars: {
            autoplay: 1,
            rel: 0,
            playsinline: 1
        },

        events: {

            onStateChange: function(event){

                if(
                    event.data === YT.PlayerState.ENDED &&
                    !jarvisMusicStopped
                ){
                    playNextJarvisSong();
                }

            }

        }

    });
}

function playNextJarvisSong(){

    if(jarvisMusicStopped) return;

    jarvisMusicIndex++;

    if(jarvisMusicIndex >= jarvisMusicQueue.length){

        jarvisMusicIndex = 0;
    }

    const song = jarvisMusicQueue[jarvisMusicIndex];

    if(!song) return;

    addTextMessage(
        "bot",
        "▶️ Next: " + song.title
    );

    createJarvisPlayer(song.video_id);
}

async function playJarvisMusic(songName){

    if(!songName){
        addTextMessage("bot", "🎵 Song ka naam batao.");
        return;
    }

    jarvisMusicStopped = false;
    jarvisMusicIndex = 0;

    addTextMessage(
        "bot",
        "🎵 JARVIS \"" + songName + "\" search kar raha hai..."
    );

    try {

        const response = await fetch(
            BACKEND + "/youtube-search?q=" +
            encodeURIComponent(songName)
        );

        const data = await response.json();

        if(!response.ok || !data.success){

            addTextMessage(
                "bot",
                "❌ " + (data.message || "Song nahi mila.")
            );

            return;
        }

        jarvisMusicQueue = data.videos || [];

        if(!jarvisMusicQueue.length){

            addTextMessage(
                "bot",
                "❌ Playable song nahi mila."
            );

            return;
        }

        const firstSong = jarvisMusicQueue[0];

        createJarvisPlayer(firstSong.video_id);

        addTextMessage(
            "bot",
            "▶️ Playing: " + firstSong.title
        );

    } catch(error) {

        addTextMessage(
            "bot",
            "❌ Music error: " + error.message
        );

        console.error(error);
    }
}

function stopJarvisMusic(){

    jarvisMusicStopped = true;
    jarvisMusicQueue = [];
    jarvisMusicIndex = 0;

    if(jarvisYTPlayer){

        try{
            jarvisYTPlayer.stopVideo();
        }catch(e){}

    }

    const box = document.getElementById("jarvisMusicPlayer");

    if(box){
        box.style.display = "none";
    }

    addTextMessage(
        "bot",
        "🛑 Song stopped. JARVIS normal mode mein aa gaya."
    );
}

async function sendMessage(){

    const text = input.value.trim();


const stopMusicMatch = text.match(
    /^(?:stop song|stop music|song stop|music stop)$/i
);

if(stopMusicMatch){
    input.value = "";
    stopJarvisMusic();
    return;
}

const musicMatch = text.match(
    /^(?:play|play song|play music|music play|song play)\s+(.+)$/i
);

if(musicMatch){
    input.value = "";
    playJarvisMusic(musicMatch[1].trim());
    return;
}


    if(!text && !selectedImage) return;

    if(text){
        addTextMessage("user", text);
    }

    input.value = "";

    const thinking = addTextMessage("bot", "🤖 JARVIS is thinking...");

    try {

        if(selectedImage){

            addTextMessage(
                "bot",
                "⏳ JARVIS image bana raha hai...\nPlease wait, image generation mein thoda time lag sakta hai."
            );

            const formData = new FormData();

            formData.append("image", selectedImage);
            formData.append(
                "prompt",
                text || "Make this image into a high-quality anime style."
            );

            let response;

            try {

                response = await fetch(
                    BACKEND + "/analyze-image",
                    {
                        method: "POST",
                        body: formData
                    }
                );

            } catch(networkError) {

                thinking.remove();

                addTextMessage(
                    "bot",
                    "❌ JARVIS server se connection nahi ho pa raha.\n\n" +
                    "Network error: " + networkError.message
                );

                return;
            }

            const raw = await response.text();

            let data = {};

            try {
                data = JSON.parse(raw);
            } catch(e) {
                data = {message: raw};
            }

            thinking.remove();

            if(!response.ok){

                addTextMessage(
                    "bot",
                    "❌ JARVIS image error (HTTP " +
                    response.status +
                    "):\n" +
                    (data.message || data.details || raw)
                );

                return;
            }

            if(data.image_url){

                addGeneratedImage(
                    data.image_url,
                    data.message || "🖼️ JARVIS ne anime image create kar di!"
                );

            }else{

                addTextMessage(
                    "bot",
                    data.message || "❌ JARVIS image nahi bana saka."
                );
            }

        }else{

            const response = await fetch(
                BACKEND + "/ask",
                {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        command: text
                    })
                }
            );

            const data = await response.json();

            thinking.remove();

            const answer =
                data.reply ||
                data.response ||
                data.answer ||
                data.message ||
                "Sorry, I could not understand that.";

            addTextMessage("bot", answer);

            speak(answer);
        }

    }catch(error){

        thinking.remove();

        addTextMessage(
            "bot",
            "❌ JARVIS error: " + error.message
        );

        console.error(error);

    }finally{

        selectedImage = null;
        imageInput.value = "";
        previewBox.style.display = "none";
        previewImg.src = "";
    }
}

function addGeneratedImage(src,caption){

    const message = document.createElement("div");

    message.className = "message bot";

    const bubble = document.createElement("div");

    bubble.className = "bubble";

    const title = document.createElement("div");

    title.textContent = caption;

    bubble.appendChild(title);

    const img = document.createElement("img");

    img.src = src;
    img.className = "chat-image";

    bubble.appendChild(img);

    const download = document.createElement("a");

    download.href = src;
    download.download = "jarvis-generated-image.png";
    download.className = "download";
    download.textContent = "⬇️ Download";

    bubble.appendChild(download);

    message.appendChild(bubble);

    chat.appendChild(message);

    chat.scrollTop = chat.scrollHeight;

    speak(caption);
}

input.addEventListener("keydown",function(e){

    if(e.key === "Enter"){
        sendMessage();
    }

});

function startVoice(){

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

    if(!SpeechRecognition){

        addTextMessage(
            "bot",
            "🎤 Aapke browser mein voice input supported nahi hai."
        );

        return;
    }

    const recognition = new SpeechRecognition();

    recognition.lang = "en-IN";
    recognition.interimResults = false;

    recognition.start();

    recognition.onresult = function(event){

        const text =
            event.results[0][0].transcript;

        input.value = text;

        sendMessage();
    };

    recognition.onerror = function(){

        addTextMessage(
            "bot",
            "🎤 Voice input start nahi ho saka."
        );
    };
}

function speak(text){

    if(!("speechSynthesis" in window)) return;

    speechSynthesis.cancel();

    const utterance =
        new SpeechSynthesisUtterance(text);

    utterance.lang = "en-IN";
    utterance.rate = 1;

    speechSynthesis.speak(utterance);
}

</script>
